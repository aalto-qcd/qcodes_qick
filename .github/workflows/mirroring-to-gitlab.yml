name: Mirror to GitLab
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all commit history

      - name: Add GitLab remote
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@version.aalto.fi/gitlab/qcd_labs/qickodes.git

      - name: Push to GitLab
        run: |
          git push gitlab "${GITHUB_REF}"
